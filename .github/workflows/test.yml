name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant-tests:
    name: Home Assistant tests (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r tests/requirements.txt

      - name: Run Home Assistant integration tests
        run: python -m pytest -q tests
